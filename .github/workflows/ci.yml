name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run :core tests
        run: ./gradlew :core:test --no-daemon --stacktrace
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

  android-app:
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        run: |
          echo "===== COMPILER ERRORS ====="
          grep -nE "^e: |error:|Kotlin compiler error|Location:|What went wrong|requires libraries|Dependency '" build.log | cut -c1-300 | head -120
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gymquest-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
